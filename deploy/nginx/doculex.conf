# DocuLex behind the VPS's existing nginx. Copy to /etc/nginx/sites-available/doculex.conf,
# replace api.example.com, link it into sites-enabled, then: sudo nginx -t && sudo systemctl reload nginx
# HTTPS: once DNS points here, `sudo certbot --nginx -d api.example.com` adds the 443 block and the
# certificate, and redirects HTTP to HTTPS. (The certificate can't exist before the domain does,
# which is why this file starts on port 80 only.)

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # nginx's default is 1 MB; DocuLex accepts 20 MB PDFs (the app returns 413 above that itself).
    client_max_body_size 21m;

    location / {
        proxy_pass http://127.0.0.1:5100;   # DOCULEX_HOST_PORT in /opt/doculex/.env
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # Overwrite, don't append: a client-sent X-Forwarded-For must not reach Fastify as trusted.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /ask can take a while when the fallback chain runs (Claude -> OpenAI -> Gemini).
        proxy_read_timeout 90s;
    }
}
