services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: doculex
      POSTGRES_PASSWORD: doculex
      POSTGRES_DB: doculex
    ports:
      - "5433:5432"          # 5433 on your PC, so it won't clash with your existing Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doculex"]
      interval: 5s
      retries: 5
volumes:
  pgdata: {}