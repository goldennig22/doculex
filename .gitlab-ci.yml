# GitLab CI/CD — DocuLex
# Every push: lint -> typecheck -> test. Push to main: + deploy to the VPS.
#
# CI/CD variables (Settings > CI/CD > Variables), all Protected + main protected:
#   SSH_PRIVATE_KEY      – private key; its public half is in the VPS user's authorized_keys
#   SSH_KNOWN_HOSTS      – output of `ssh-keyscan <VPS_IP>` run once from your PC
#   VPS_IP, VPS_USER     – where to deploy
#   DOCULEX_DEPLOY_PATH  – absolute path of the DocuLex checkout on the VPS

stages: [lint, typecheck, test] #add "deploy" whenever ready to deploy

default:
  image: node:22-alpine
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund

lint:
  stage: lint
  script: npm run lint

typecheck:
  stage: typecheck
  script: npm run typecheck

test:
  stage: test
  script: npm test

deploy_to_vps:
  stage: deploy
  image: alpine:3.20
  resource_group: production        # never two deploys at once
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:                    # replaces the default npm ci; no Node needed here
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
  script:
    - ssh "$VPS_USER@$VPS_IP" "DEPLOY_BRANCH='$CI_COMMIT_BRANCH' DEPLOY_PATH='$DOCULEX_DEPLOY_PATH' bash '$DOCULEX_DEPLOY_PATH/deploy.sh'"
  after_script:
    - ssh-agent -k > /dev/null 2>&1 || true